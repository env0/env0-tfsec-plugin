name: tfsec
icon: https://aquasecurity.github.io/tfsec/v1.28.1/imgs/tfsec.png
inputs:
  version:
    description: The specific version of tfsec you wish to use
    required: true
  directory:
    description: The IaC directory you want to analyze with tfsec
    required: true
  flags:
    description: Additional tfsec flags
run:
  exec: |
    export TFSEC_VERSION="${inputs.version}"
    export TFSEC_INSTALL_PATH="/home/node/.local/bin"
    
    if [ "${TFSEC_VERSION}" == "latest" ]; then echo "This plugin requires a specific tfsec version" && exit 2; fi
    
    case "$(uname -m)" in
      x86_64) TFSEC_ARCH=amd64 ;;
      aarch64|arm64) TFSEC_ARCH=arm64 ;;
      *) echo "Unsupported architecture: $(uname -m)" && exit 2 ;;
    esac

    # Download the release binary directly, retrying GitHub errors such as 504, and stop with the URL if it still fails
    TFSEC_URL="https://github.com/aquasecurity/tfsec/releases/download/v${TFSEC_VERSION#v}/tfsec-linux-${TFSEC_ARCH}"
    mkdir -p "${TFSEC_INSTALL_PATH}"
    curl --retry 5 --retry-all-errors -fsSL -o "${TFSEC_INSTALL_PATH}/tfsec" "${TFSEC_URL}" || { echo "Couldn't download ${TFSEC_URL}" >&2; exit 1; }
    chmod +x "${TFSEC_INSTALL_PATH}/tfsec"

    "${TFSEC_INSTALL_PATH}/tfsec" ${inputs.directory} ${inputs.flags}
